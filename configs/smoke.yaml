seed: 7
experiment: smoke
output_dir: runs/smoke

data:
  root: data/toy
  manifest: manifest.csv
  image_size: 128
  num_workers: 0
  authentic_probability: 0.0
  jpeg_probability: 0.1
  jpeg_quality: [60, 95]
  blur_probability: 0.1
  color_jitter: 0.05

model:
  base_channels: 12
  decoder_channels: 32
  depths: [1, 1, 1, 1]
  recycle_steps: 1
  residual_kernels: 4
  drop_path: 0.0
  use_quality_calibration: true
  use_content_orthogonalization: true
  use_counterfactual_intervention: true
  use_evidence_ledger: true
  use_uncertainty_refinement: true
  intervention_neighborhood: 7
  intervention_teacher_mix: 0.5

loss:
  weights:
    localization: 1.0
    dice: 0.5
    boundary: 0.2
    deep_supervision: 0.3
    proposal: 0.1
    counterfactual: 0.2
    ledger: 0.15
    intervention_locality: 0.03
    orthogonality: 0.03
    image: 0.2
    degradation_consistency: 0.1
    variance_regularization: 0.01
  positive_weight_clip: [1.0, 10.0]
  boundary_kernel: 3
  counterfactual_margin: 0.5

training:
  epochs: 2
  batch_size: 2
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_epochs: 0
  grad_clip: 1.0
  amp: false
  consistency_probability: 0.25
  intervention_teacher_probability: 0.5
  log_interval: 1
  early_stopping: 4

evaluation:
  batch_size: 2
  threshold: 0.5
  thresholds: 21
  save_predictions: true

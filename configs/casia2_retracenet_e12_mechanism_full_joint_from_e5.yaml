    - patterns: [content_encoder.layer4]
      lr: 5.0e-08
      weight_decay: 0.01
    - patterns: [decoder]
      lr: 5.0e-07
      weight_decay: 0.01
    - patterns: [mask_head, log_var_head, aux_heads, image_head]
      lr: 8.0e-07
      weight_decay: 0.01
  ema: true
  ema_decay: 0.999
  deep_supervision_weights: [0.3, 0.2, 0.1]
  strict_checkpoint: true
